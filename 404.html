<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- The presence of this file also switches Cloudflare Pages from SPA
     fallback (200 + index.html for any missing path) to real 404s, which
     the app relies on to detect a missing dataset file. -->
<title>404 · Podroll Atlas</title>
<meta name="theme-color" content="#0b0d12" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151821;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --border: #2a2f3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 32px; max-width: 420px; text-align: center; }
  .dot { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; }
  a.btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>404 · Not found</h1>
    <p>This page doesn't exist. Every podcast in the Atlas lives at the home page.</p>
    <a class="btn" href="/">Back to the Atlas</a>
  </div>
</body>
</html>
